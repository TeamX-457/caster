{% extends "base.html" %}

{% block title %}Add a teacher — CASTER{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-6 py-20">
    <h1 class="text-2xl font-bold text-brand-navy">Add a teacher</h1>
    <p class="mt-1 text-sm text-slate-600">Create an account for a teacher at {{ request.user.school.name }}.</p>

    <form method="post" class="mt-6">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="w-full rounded-md bg-brand-navy px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-navy-light">
            Add teacher
        </button>
    </form>

    <p class="mt-6 text-center text-sm">
        <a href="{% url 'accounts:dashboard' %}" class="font-semibold text-brand-navy hover:underline">&larr; Back to dashboard</a>
    </p>
</section>
{% endblock %}
