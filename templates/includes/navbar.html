<header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-100">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
            <a href="{% url 'marketing:home' %}" class="flex items-center gap-2">
                <span class="flex h-8 w-8 items-center justify-center rounded-md bg-brand-navy text-sm font-bold text-brand-gold">C</span>
                <span class="text-lg font-bold tracking-tight text-brand-navy">CASTER</span>
            </a>

            {% if not request.user.is_authenticated %}
                <nav class="hidden md:flex md:items-center md:gap-8">
                    <a href="{% url 'marketing:home' %}#problem" class="text-sm font-medium text-slate-600 hover:text-brand-navy">Problem</a>
                    <a href="{% url 'marketing:home' %}#product" class="text-sm font-medium text-slate-600 hover:text-brand-navy">Product</a>
                    <a href="{% url 'marketing:home' %}#audience" class="text-sm font-medium text-slate-600 hover:text-brand-navy">Who it's for</a>
                    <a href="{% url 'marketing:home' %}#mission" class="text-sm font-medium text-slate-600 hover:text-brand-navy">Mission</a>
                </nav>
            {% endif %}

            <div class="flex items-center gap-4">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'accounts:dashboard' %}" class="text-sm font-medium text-slate-600 hover:text-brand-navy">Dashboard</a>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="text-sm font-medium text-slate-600 hover:text-brand-navy">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="text-sm font-medium text-slate-600 hover:text-brand-navy">Log in</a>
                    <a href="{% url 'accounts:signup_student' %}" class="rounded-md bg-brand-navy px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-navy-light">
                        Sign up
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
