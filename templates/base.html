{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CASTER Learning Technologies{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}CASTER helps students learn smarter with structured study guides, active learning tools, and progress tracking.{% endblock %}">
    {% tailwind_css %}
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-white text-brand-navy-dark font-sans antialiased">
    {% include "includes/navbar.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "includes/footer.html" %}

    {% block extra_body %}{% endblock %}
</body>
</html>
