name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caster
          POSTGRES_PASSWORD: caster
          POSTGRES_DB: caster
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://caster:caster@localhost:5432/caster

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Tailwind CLI binary
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pytailwindcss
          key: tailwind-cli-${{ runner.os }}

      - name: Install & build Tailwind CSS
        run: |
          python manage.py tailwind install --no-input
          python manage.py tailwind build

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Collectstatic (sanity check)
        run: python manage.py collectstatic --no-input
